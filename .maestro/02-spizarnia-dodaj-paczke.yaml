appId: pl.lukasz.napar
name: 02 Spiżarnia — dodanie paczki i jej widoczność (wynik w danych)
# PU-003 · ekran:(tabs)/beans
---
- launchApp:
    arguments:
      AppleLanguages: "(pl)"
      AppleLocale: "pl_PL"
- tapOn:
    id: "onboarding-submit-btn"
    optional: true
- tapOn:
    id: "app-guide-got-it-btn"
    optional: true
- tapOn: "Spiżarnia, tab, .*"
- assertVisible:
    id: "ekran:\\(tabs\\)/beans"
- tapOn:
    id: "beans-add-button"
- tapOn:
    id: "bean-name-input"
- inputText: "E2E Kenia"
- swipe:
    start: "50%, 40%"
    end: "50%, 15%"
- scrollUntilVisible:
    element:
      id: "bean-weight-input"
- tapOn:
    id: "bean-weight-input"
- inputText: "250"
- tapOn:
    id: "save-bean-btn"
- tapOn: "OK"
- assertVisible: "E2E Kenia"
- takeScreenshot: 02-spizarnia-dodaj-paczke
