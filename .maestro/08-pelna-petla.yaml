appId: pl.lukasz.napar
name: 08 Pełna pętla parzenie → ocena → zapis do Dziennika
# PU-002 · ekran:(tabs)/index · ekran:(tabs)/journal
---
- launchApp:
    arguments:
      AppleLanguages: "(pl)"
      AppleLocale: "pl_PL"
- tapOn:
    id: "onboarding-submit-btn"
    optional: true
- tapOn:
    id: "app-guide-got-it-btn"
    optional: true
- tapOn: "Parzenie, tab, .*"
- scrollUntilVisible:
    element:
      id: "open-procedure-modal-btn"
- tapOn:
    id: "open-procedure-modal-btn"
- tapOn:
    id: "procedure-start-btn"
- tapOn:
    id: "procedure-pause-resume-btn"
- tapOn:
    id: "save-brew-btn"
- assertVisible:
    id: "star-rating-5"
- tapOn:
    id: "star-rating-5"
- scrollUntilVisible:
    element:
      id: "finish-notes-input"
- tapOn:
    id: "finish-notes-input"
- inputText: "E2E pelna petla"
- hideKeyboard
# powrót: (tabs)/index
- tapOn:
    id: "finish-save-btn"
- tapOn: "OK"
- tapOn: "Dziennik, tab, .*"
- assertVisible:
    id: "journal-tab-sessions"
- assertVisible: "E2E pelna petla"
- takeScreenshot: 08-pelna-petla
# powrót: (tabs)/journal
- tapOn: "Parzenie, tab, .*"
- assertVisible:
    id: "ekran:\\(tabs\\)/index"
