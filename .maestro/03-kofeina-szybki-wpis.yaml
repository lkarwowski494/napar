appId: pl.lukasz.napar
name: 03 Kofeina — szybki wpis V60
---
- launchApp:
    arguments:
      AppleLanguages: "(pl)"
      AppleLocale: "pl_PL"
- tapOn:
    id: "app-guide-got-it-btn"
    optional: true
# Zakładka Kofeina jest ukryta (href: null) — wejście przez Dial-in i kartę kalkulatora kofeiny.
- tapOn: "Dial-in"
- scrollUntilVisible:
    element:
      id: "open-caffeine-from-workshop"
- tapOn:
    id: "open-caffeine-from-workshop"
- tapOn:
    id: "quick-add-caffeine-btn"
- tapOn:
    id: "caffeine-quick-v60"
- takeScreenshot: 03-kofeina-szybki-wpis
