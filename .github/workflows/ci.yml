name: "CI: Typy, Kontrakty, Pokrycie i Zero-Telemetria"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      # M1-audytor-generalny-011: jedna definicja bramki — te same kroki co lokalnie (package.json "verify").
      - name: Bramka jakości (npm run verify)
        run: npm run verify

  perf:
    # Budżety czasu CPU: informacyjnie, poza bramką (07-jakosc-003).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Budżety czasu CPU (raport, nie bramka)
        run: npm run test:perf

  secrets:
    # M1-audytor-generalny-014: skan sekretów (gitleaks) w przypiętej wersji z weryfikacją SHA-256; brak binarki = błąd skryptu.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalacja gitleaks (przypięta wersja + SHA-256)
        env:
          GITLEAKS_VERSION: '8.21.2'
          GITLEAKS_SHA256: '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba'
        run: |
          mkdir -p "$HOME/bin"
          ARCHIVE="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$ARCHIVE"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xz -f "$ARCHIVE" -C "$HOME/bin" gitleaks
          rm -f "$ARCHIVE"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Skan sekretów w zakresie zmian
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -1)"; fi
          bash .github/scripts/gitleaks-range.sh "$BASE_SHA" "$GITHUB_SHA"
