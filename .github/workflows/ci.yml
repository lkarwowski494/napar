name: "CI: Typy, Kontrakty, Pokrycie i Zero-Telemetria"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      # M1-audytor-generalny-011: jedna definicja bramki — te same kroki co lokalnie (package.json "verify").
      - name: Bramka jakości (npm run verify)
        run: npm run verify

  perf:
    # Budżety czasu CPU: informacyjnie, poza bramką (07-jakosc-003).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Budżety czasu CPU (raport, nie bramka)
        run: npm run test:perf
