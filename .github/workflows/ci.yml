name: CI: Typy, Kontrakty, Pokrycie i Zero-Telemetria

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów TypeScript
        run: npm run typecheck

      - name: Pełny zestaw testów z progami pokrycia, kontraktami i budżetem CPU
        run: npm run test:coverage -- --ci
