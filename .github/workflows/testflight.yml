name: Build & Upload to TestFlight (iOS)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Numer buildu (opcjonalnie; domyślnie najwyższy protokół z docs/jakosc/test-fizyczny/ lub buildNumber + run_number)'
        required: false
        default: ''
      notes:
        description: 'Notatka do wydania (opcjonalnie)'
        required: false
        default: ''

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  FORCE_COLOR: '1'
  APP_SCHEME: 'Napar'
  APP_DIR: 'Napar'
  BUNDLE_ID: 'pl.lukasz.napar'
  # Baza numeru buildu: jedno źródło w app.json (expo.ios.buildNumber) — M1-audytor-generalny-014.

jobs:
  gate:
    # M1-audytor-generalny-036 (DEC-11 a) + DEEP-006: wysyłka przy zielonym CI na GITHUB_SHA i E2E na kodowo tożsamym SHA.
    name: CI i E2E zielone na tym SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build_number: ${{ steps.scenarios.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wymagaj zielonego CI i E2E na GITHUB_SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/require-green-runs.mjs "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Bramka scenariuszy użytkownika (D-060)
        id: scenarios
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_BASE=$(node -p "require('./app.json').expo.ios.buildNumber")
          # DEEP-006: numer buildu nie zależy od zmiennego GITHUB_RUN_NUMBER, gdy podano input lub przygotowano protokół F.
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD="$INPUT_BUILD_NUMBER"
          else
            PROTO_BUILD=$(node -e "const fs=require('fs');const d='docs/jakosc/test-fizyczny';const nums=fs.existsSync(d)?fs.readdirSync(d).filter(f=>/^\d+\.md$/.test(f)).map(f=>Number(f.slice(0,-3))):[];console.log(nums.length?Math.max(...nums):'');")
            if [ -n "$PROTO_BUILD" ] && [ "$PROTO_BUILD" -gt "$BUILD_BASE" ]; then
              BUILD="$PROTO_BUILD"
            else
              BUILD=$((BUILD_BASE + GITHUB_RUN_NUMBER))
            fi
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Nieprawidłowy numer buildu: '$BUILD'"
            exit 1
          fi
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

          # DEEP-006: dopasuj SHA E2E do logiki sprawdz-scenariusze.mjs (dopuszczalna różnica wyłącznie w docs/jakosc/).
          E2E_RUN_ID=""
          for CAND in $(git rev-list --first-parent -n 20 "$GITHUB_SHA"); do
            if [ "$CAND" != "$GITHUB_SHA" ]; then
              NON_DOCS=$(git diff --name-only "$CAND" "$GITHUB_SHA" | grep -v '^docs/jakosc/' || true)
              if [ -n "$NON_DOCS" ]; then
                break
              fi
            fi
            E2E_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$CAND" --workflow e2e-ios.yml --status success --json databaseId --jq '.[0].databaseId')
            if [ -n "$E2E_RUN_ID" ] && [ "$E2E_RUN_ID" != "null" ]; then
              break
            fi
          done
          if [ -z "$E2E_RUN_ID" ] || [ "$E2E_RUN_ID" = "null" ]; then
            echo "::error::Brak zielonego przebiegu e2e-ios.yml na $GITHUB_SHA (ani na przodku różniącym się tylko docs/jakosc/)"
            exit 1
          fi
          gh run download "$E2E_RUN_ID" --repo "$GITHUB_REPOSITORY" -n e2e-wykonane
          test -f wykonane.tsv || { echo "::error::Artefakt e2e-wykonane nie zawiera pliku wykonane.tsv"; exit 1; }
          node scripts/sprawdz-scenariusze.mjs --build "$BUILD" --wykonane wykonane.tsv

  build:
    name: Archive & Upload (.ipa -> TestFlight)
    needs: gate
    runs-on: macos-26
    environment: production
    timeout-minutes: 90
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is on origin/main
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            git fetch origin main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA nie jest przodkiem gałęzi origin/main!"
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26 (iOS 26 SDK)
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install JS dependencies
        run: npm ci

      - name: Guard against test/mock flags in release build
        run: |
          for var in EXPO_PUBLIC_STORE_FAKE EXPO_PUBLIC_E2E EXPO_PUBLIC_MOCK_AUTH EXPO_PUBLIC_DEMO_MODE; do
            val="${!var:-}"
            if [ -n "$val" ] && [ "$val" != "0" ]; then
              echo "::error::Flaga testowa $var=$val nie może być ustawiona w wydaniu produkcyjnym!"
              exit 1
            fi
          done

      - name: Run quality gates (Verify)
        run: npm run verify

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Verify native iOS project invariants
        run: node scripts/verify-native.mjs

      - name: Compute & set monotonic build number
        id: ver
        env:
          GATE_BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Nieprawidłowy format wersji w app.json: '$VERSION' (wymagane X.Y lub X.Y.Z)"
            exit 1
          fi
          BUILD_BASE=$(node -p "require('./app.json').expo.ios.buildNumber")
          BUILD_NUMBER="${GATE_BUILD_NUMBER:-$((BUILD_BASE + GITHUB_RUN_NUMBER))}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Nieprawidłowy numer buildu: '$BUILD_NUMBER'"
            exit 1
          fi
          echo "Ustawianie wersji $VERSION ($BUILD_NUMBER)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "ios/$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "ios/$APP_DIR/Info.plist"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods
        id: pods-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-v3-${{ runner.os }}-xcode26-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: |
            pods-v3-${{ runner.os }}-xcode26-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" != "true" ]; then
            pod install --repo-update
          else
            pod install
          fi

      - name: Ensure iOS Platform SDK matches selected Xcode
        run: bash scripts/ci/ensure-ios-platform.sh

      - name: Verify PrivacyInfo.xcprivacy after pod install
        run: |
          PRIV="ios/$APP_DIR/PrivacyInfo.xcprivacy"
          test -f "$PRIV" || { echo "::error::Brak $PRIV"; exit 1; }
          plutil -lint "$PRIV"
          for cat in NSPrivacyAccessedAPICategoryUserDefaults NSPrivacyAccessedAPICategoryFileTimestamp NSPrivacyAccessedAPICategorySystemBootTime NSPrivacyAccessedAPICategoryDiskSpace; do
            grep -q "$cat" "$PRIV" || { echo "::error::Brak kategorii $cat w $PRIV"; exit 1; }
          done
          grep -q "PrivacyInfo.xcprivacy" "ios/$APP_SCHEME.xcodeproj/project.pbxproj" || {
            echo "::error::PrivacyInfo.xcprivacy nie jest podpięty w project.pbxproj"
            exit 1
          }

      - name: Archive (Release, unsigned build step)
        env:
          CI: '1'
          NODE_ENV: production
          # 12-niezawodnosc-008: react-native-xcode.sh składa mapę źródeł Hermesa do tej ścieżki (archiwum niżej).
          SOURCEMAP_FILE: ${{ runner.temp }}/sourcemaps/main.jsbundle.map
        run: |
          set -o pipefail
          mkdir -p "$(dirname "$SOURCEMAP_FILE")"
          set +e
          xcodebuild archive \
            -workspace "ios/$APP_SCHEME.xcworkspace" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_SCHEME.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > /tmp/xcodebuild-archive.log 2>&1
          ARCHIVE_RC=$?
          set -e
          grep -E "^(===|CompileC|Ld |Touch |RegisterExecutionPolicyException|\*\* ARCHIVE|error:|warning:.*\berror\b)" /tmp/xcodebuild-archive.log || true

          if [ "$ARCHIVE_RC" -ne 0 ] || [ ! -d "$RUNNER_TEMP/$APP_SCHEME.xcarchive/Products/Applications/$APP_SCHEME.app" ]; then
            echo "::error::Archiwum .xcarchive nie powiodło się (exit=$ARCHIVE_RC) — ostatnie 80 linii logu:"
            tail -80 /tmp/xcodebuild-archive.log
            exit $((ARCHIVE_RC != 0 ? ARCHIVE_RC : 1))
          fi
          test -s "$SOURCEMAP_FILE" || echo "::warning::Brak mapy źródeł JS ($SOURCEMAP_FILE) — stos JS z raportu awarii nie da się zmapować"

      - name: Prepare App Store Connect API Key (.p8) after pod install & archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 || secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}
        run: |
          set +x
          for req in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!req:-}" ]; then
              echo "::error::Brak wymaganego sekretu GitHub: $req (zobacz docs/15-app-store.md)"
              exit 1
            fi
          done
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{6,16}$ ]]; then
            echo "::error::Nieprawidłowy format ASC_KEY_ID"
            exit 1
          fi
          umask 077
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8_BASE64" =~ "BEGIN PRIVATE KEY" ]]; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::Zdekodowany klucz .p8 nie zawiera nagłówka BEGIN PRIVATE KEY"
            rm -f "$KEY_PATH"
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist & Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '8NQ9GHY8GF' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
          </dict>
          </plist>
          EOF

          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | sed \
              -e "s/${ASC_KEY_ID}/<KEY_ID>/g" \
              -e "s/${ASC_ISSUER_ID}/<ISSUER_ID>/g" \
              -e "s/${APPLE_TEAM_ID}/<TEAM_ID>/g" \
              > /tmp/xcodebuild-export.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "::error::Eksport i wysyłka do TestFlight nie powiodły się (kod $RC). Ostatnie 80 linii:"
            tail -80 /tmp/xcodebuild-export.log
            exit "$RC"
          fi
          tail -30 /tmp/xcodebuild-export.log

      - name: Clean up credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc_private_keys" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Write release summary
        if: always()
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "## Wydanie TestFlight — $APP_SCHEME"
            echo ""
            echo "| Parametr | Wartość |"
            echo "| :--- | :--- |"
            echo "| **Bundle ID** | \`$BUNDLE_ID\` |"
            echo "| **Wersja** | \`${VERSION:-?}\` |"
            echo "| **Numer buildu** | \`${BUILD_NUMBER:-?}\` |"
            echo "| **Commit** | \`${GITHUB_SHA}\` |"
            echo "| **Notatka** | ${RELEASE_NOTES:-*(brak)*} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Hermes sourcemaps and dSYM symbols
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-sourcemaps-dsym-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/sourcemaps/main.jsbundle.map
            ${{ runner.temp }}/${{ env.APP_SCHEME }}.xcarchive/dSYMs
          retention-days: 30

      - name: Upload scrubbed logs on failure only (retention 1 day)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testflight-xcodebuild-logs-${{ github.run_number }}
          path: /tmp/xcodebuild-*.log
          retention-days: 1

  tag:
    name: Create Git Tag
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Create and push tag vX.Y.Z-bNNNN
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build_number }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Nieprawidłowe dane wyjściowe wersji lub buildu: VERSION='$VERSION' BUILD='$BUILD'"
            exit 1
          fi
          TAG="v${VERSION}-b${BUILD}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} już istnieje w origin — odmowa nadpisania tagu wydania!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${TAG}"
