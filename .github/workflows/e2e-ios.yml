name: E2E iOS (Maestro)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
      - '.maestro/**'
  pull_request:
    paths:
      - 'ios/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
      - '.maestro/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  APP_SCHEME: 'Napar'
  BUNDLE_ID: 'pl.lukasz.napar'

jobs:
  e2e-ios:
    name: Maestro E2E on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install JS dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Build iOS Simulator App (.app)
        env:
          # Konfiguracja testowa: fałszywy sklep w E2E (bez StoreKit i bez produktów w App Store Connect).
          EXPO_PUBLIC_STORE_FAKE: '1'
        run: |
          set -o pipefail
          cd ios
          pod install
          xcodebuild -workspace Napar.xcworkspace -scheme Napar -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/xcodebuild-sim.log
          APP_PATH="build/Build/Products/Debug-iphonesimulator/Napar.app"
          test -d "$APP_PATH" || { echo "::error::Kompilacja .app symulatora nie powiodła się"; exit 1; }
          echo "SIM_APP_PATH=$(pwd)/$APP_PATH" >> "$GITHUB_ENV"

      - name: Cache & Save Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: ios/build/Build/Products/Debug-iphonesimulator/Napar.app
          retention-days: 14

      - name: Boot iOS Simulator with Perl Process Guard
        run: |
          guard() {
            local timeout_sec="$1"
            local desc="$2"
            shift 2
            perl -e '
              use strict;
              use warnings;
              use POSIX ":sys_wait_h";
              my ($timeout, $desc, @cmd) = @ARGV;
              my $pid = fork();
              if (!defined $pid) { die "fork failed: $!\n"; }
              if ($pid == 0) {
                setpgrp(0, 0);
                exec(@cmd) or die "exec failed: $!\n";
              }
              my $start = time();
              while (1) {
                my $res = waitpid($pid, WNOHANG);
                if ($res == $pid) { exit($? >> 8); }
                if (time() - $start > $timeout) {
                  kill("TERM", -$pid);
                  sleep(5);
                  kill("KILL", -$pid);
                  die "guard timeout ($timeout s) exceeded for $desc\n";
                }
                select(undef, undef, undef, 0.5);
              }
            ' "$timeout_sec" "$desc" "$@"
          }
          DEVICE_UDID=$(xcrun simctl list devices 'iPhone 16 Pro' | grep -v unavailable | grep -E -o '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices available | grep -E -o '[0-9A-F-]{36}' | head -n 1)
          fi
          echo "Booting device: $DEVICE_UDID"
          guard 300 "simctl boot" xcrun simctl boot "$DEVICE_UDID" || true
          guard 300 "bootstatus" xcrun simctl bootstatus "$DEVICE_UDID" -b
          guard 120 "install app" xcrun simctl install booted "$SIM_APP_PATH"

      - name: Run Maestro Flows with Retry on Driver Failure
        run: |
          guard() {
            local timeout_sec="$1"
            local desc="$2"
            shift 2
            perl -e '
              use strict;
              use warnings;
              use POSIX ":sys_wait_h";
              my ($timeout, $desc, @cmd) = @ARGV;
              my $pid = fork();
              if (!defined $pid) { die "fork failed: $!\n"; }
              if ($pid == 0) {
                setpgrp(0, 0);
                exec(@cmd) or die "exec failed: $!\n";
              }
              my $start = time();
              while (1) {
                my $res = waitpid($pid, WNOHANG);
                if ($res == $pid) { exit($? >> 8); }
                if (time() - $start > $timeout) {
                  kill("TERM", -$pid);
                  sleep(5);
                  kill("KILL", -$pid);
                  die "guard timeout ($timeout s) exceeded for $desc\n";
                }
                select(undef, undef, undef, 0.5);
              }
            ' "$timeout_sec" "$desc" "$@"
          }

          run_maestro() {
            local flow="$1"
            echo "::group::Uruchamianie $flow"
            guard 600 "maestro $flow" maestro test "$flow" > /tmp/maestro.log 2>&1
            local rc=$?
            if [ $rc -ne 0 ]; then
              if grep -qE "iOS driver not ready in time|deviceInfo failed" /tmp/maestro.log; then
                echo "::warning::Wykryto awarię sterownika XCUITest. Ponawianie 1x po resecie..."
                sleep 5
                guard 600 "maestro retry $flow" maestro test "$flow" > /tmp/maestro.log 2>&1
                rc=$?
              fi
            fi
            cat /tmp/maestro.log
            echo "::endgroup::"
            return $rc
          }

          run_maestro .maestro/01-receptura-v60.yaml
          run_maestro .maestro/02-stoper-zalewania.yaml
          run_maestro .maestro/03-spizarnia-ziarna.yaml
          run_maestro .maestro/04-dziennik-parzen.yaml
          run_maestro .maestro/05-gongfu-cha.yaml

      - name: Live Update Migration Test (Without simctl uninstall)
        run: |
          echo "Testowanie aktualizacji na żywo bez deinstalacji..."
          maestro test .maestro/06-aktualizacja-przygotuj.yaml
          xcrun simctl install booted "$SIM_APP_PATH"
          maestro test .maestro/07-aktualizacja-sprawdz.yaml

      - name: Diagnostic Base64 Screenshot on Failure
        if: failure()
        run: |
          xcrun simctl io booted screenshot /tmp/fail-screen.png || true
          if [ -f /tmp/fail-screen.png ]; then
            sips -Z 480 -s format jpeg -s formatOptions 35 /tmp/fail-screen.png --out /tmp/fail-screen.jpg || true
            echo "=== SCREENSHOT_BASE64_START ==="
            base64 -i /tmp/fail-screen.jpg || true
            echo "=== SCREENSHOT_BASE64_END ==="
          fi
          echo "=== APP RECENT SYSTEM LOGS ==="
          xcrun simctl spawn booted log show --predicate 'process == "Napar"' --last 2m || true
