name: E2E iOS (Maestro)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'ios/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
      - '.maestro/**'
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'ios/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-ios.yml'
      - '.maestro/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '480000'
  MAESTRO_CLI_NO_ANALYTICS: '1'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
  APP_SCHEME: 'Napar'
  BUNDLE_ID: 'pl.lukasz.napar'

jobs:
  e2e-ios:
    name: Maestro E2E on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install JS dependencies
        run: npm ci

      - name: Install Maestro CLI (pinned release + SHA-256)
        env:
          MAESTRO_RELEASE_TAG: 'cli-2.12.1'
          MAESTRO_ZIP_SHA256: '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7'
        run: |
          ARCHIVE="/tmp/maestro-${MAESTRO_RELEASE_TAG}.zip"
          curl -fsSL "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_RELEASE_TAG}/maestro.zip" -o "$ARCHIVE"
          echo "${MAESTRO_ZIP_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
          rm -rf "$HOME/.maestro" /tmp/maestro-unpack
          mkdir -p /tmp/maestro-unpack
          unzip -q "$ARCHIVE" -d /tmp/maestro-unpack
          mv /tmp/maestro-unpack/maestro "$HOME/.maestro"
          rm -rf "$ARCHIVE" /tmp/maestro-unpack
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Build iOS Simulator App (.app)
        run: |
          set -o pipefail
          cd ios
          pod install
          # M1-audytor-generalny-012: Release dla symulatora — paczka JS w aplikacji (Debug pomijał ją: SKIP_BUNDLING).
          xcodebuild -workspace Napar.xcworkspace -scheme Napar -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/xcodebuild-sim.log
          APP_PATH="build/Build/Products/Release-iphonesimulator/Napar.app"
          test -d "$APP_PATH" || { echo "::error::Kompilacja .app symulatora nie powiodła się"; exit 1; }
          echo "SIM_APP_PATH=$(pwd)/$APP_PATH" >> "$GITHUB_ENV"

      - name: Cache & Save Simulator App Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-sim-app
          path: ios/build/Build/Products/Release-iphonesimulator/Napar.app
          retention-days: 14

      - name: Boot iOS Simulator with Perl Process Guard
        run: |
          guard() {
            local timeout_sec="$1"
            local desc="$2"
            shift 2
            perl -e '
              use strict;
              use warnings;
              use POSIX ":sys_wait_h";
              my ($timeout, $desc, @cmd) = @ARGV;
              my $pid = fork();
              if (!defined $pid) { die "fork failed: $!\n"; }
              if ($pid == 0) {
                setpgrp(0, 0);
                exec(@cmd) or die "exec failed: $!\n";
              }
              my $start = time();
              while (1) {
                my $res = waitpid($pid, WNOHANG);
                if ($res == $pid) { exit($? >> 8); }
                if (time() - $start > $timeout) {
                  kill("TERM", -$pid);
                  sleep(5);
                  kill("KILL", -$pid);
                  die "guard timeout ($timeout s) exceeded for $desc\n";
                }
                select(undef, undef, undef, 0.5);
              }
            ' "$timeout_sec" "$desc" "$@"
          }
          DEVICE_UDID=$(xcrun simctl list devices 'iPhone 16 Pro' | grep -v unavailable | grep -E -o '[0-9A-F-]{36}' | head -n 1)
          if [ -z "$DEVICE_UDID" ]; then
            DEVICE_UDID=$(xcrun simctl list devices available | grep -E -o '[0-9A-F-]{36}' | head -n 1)
          fi
          echo "Booting device: $DEVICE_UDID"
          guard 300 "simctl boot" xcrun simctl boot "$DEVICE_UDID" || true
          guard 300 "bootstatus" xcrun simctl bootstatus "$DEVICE_UDID" -b
          # Scenariusze używają polskich tekstów interfejsu (kontrakt: tests/e2e-contract.test.ts).
          xcrun simctl spawn booted defaults write -g AppleLanguages -array pl || true
          xcrun simctl spawn booted defaults write -g AppleLocale -string pl_PL || true
          guard 120 "install app" xcrun simctl install booted "$SIM_APP_PATH"

      - name: Run Maestro Flows with Retry on Driver Failure
        run: |
          guard() {
            local timeout_sec="$1"
            local desc="$2"
            shift 2
            perl -e '
              use strict;
              use warnings;
              use POSIX ":sys_wait_h";
              my ($timeout, $desc, @cmd) = @ARGV;
              my $pid = fork();
              if (!defined $pid) { die "fork failed: $!\n"; }
              if ($pid == 0) {
                setpgrp(0, 0);
                exec(@cmd) or die "exec failed: $!\n";
              }
              my $start = time();
              while (1) {
                my $res = waitpid($pid, WNOHANG);
                if ($res == $pid) { exit($? >> 8); }
                if (time() - $start > $timeout) {
                  kill("TERM", -$pid);
                  sleep(5);
                  kill("KILL", -$pid);
                  die "guard timeout ($timeout s) exceeded for $desc\n";
                }
                select(undef, undef, undef, 0.5);
              }
            ' "$timeout_sec" "$desc" "$@"
          }

          # M1-audytor-generalny-012: set +e — log każdego scenariusza trafia do CI także przy porażce;
          # wynik zbiorczy na końcu; zrzuty (takeScreenshot) w artefakcie.
          set +e
          mkdir -p /tmp/maestro-out /tmp/maestro-wykonane
          WYKONANE_FILE="/tmp/maestro-wykonane/wykonane.tsv"
          printf '%s\n' "$GITHUB_SHA" > "$WYKONANE_FILE"
          FAILED=0
          run_maestro() {
            local flow="$1"
            echo "::group::Uruchamianie $flow"
            guard 360 "maestro $flow" maestro test --test-output-dir /tmp/maestro-out "$flow" > /tmp/maestro.log 2>&1
            local rc=$?
            if [ $rc -ne 0 ] && grep -qE "iOS driver not ready in time|deviceInfo failed|guard timeout" /tmp/maestro.log; then
              echo "::warning::Wykryto awarię lub zawieszenie sterownika XCUITest. Ponawianie 1x po resecie..."
              sleep 5
              guard 360 "maestro retry $flow" maestro test --test-output-dir /tmp/maestro-out "$flow" > /tmp/maestro.log 2>&1
              rc=$?
            fi
            cat /tmp/maestro.log
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              printf '%s\tPASS\n' "$flow" >> "$WYKONANE_FILE"
            else
              printf '%s\tFAIL\n' "$flow" >> "$WYKONANE_FILE"
              echo "::error::Scenariusz $flow nie przeszedł (kod $rc)"; FAILED=1
            fi
          }

          run_maestro .maestro/01-start.yaml
          run_maestro .maestro/02-spizarnia-dodaj-paczke.yaml
          run_maestro .maestro/03-kofeina-szybki-wpis.yaml
          run_maestro .maestro/04-dziennik.yaml
          run_maestro .maestro/05-gongfu.yaml
          run_maestro .maestro/08-pelna-petla.yaml
          run_maestro .maestro/06-aktualizacja-przygotuj.yaml
          # Dane po ponownej instalacji tego samego buildu (bez deinstalacji): paczka z 02 ma przetrwać.
          if xcrun simctl install booted "$SIM_APP_PATH"; then
            run_maestro .maestro/07-aktualizacja-sprawdz.yaml
          else
            printf '%s\tFAIL\n' ".maestro/07-aktualizacja-sprawdz.yaml" >> "$WYKONANE_FILE"
            echo "::error::Ponowna instalacja nie powiodła się — 07 nie sprawdza danych"; FAILED=1
          fi
          exit $FAILED

      - name: Zapisz wynik scenariuszy E2E (wykonane.tsv)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-wykonane
          path: /tmp/maestro-wykonane/wykonane.tsv
          if-no-files-found: error
          retention-days: 14

      - name: Zrzuty i logi scenariuszy Maestro
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-zrzuty
          path: /tmp/maestro-out
          if-no-files-found: warn
          retention-days: 14

      - name: Diagnostic Base64 Screenshot on Failure
        if: failure()
        run: |
          xcrun simctl io booted screenshot /tmp/fail-screen.png || true
          if [ -f /tmp/fail-screen.png ]; then
            sips -Z 480 -s format jpeg -s formatOptions 35 /tmp/fail-screen.png --out /tmp/fail-screen.jpg || true
            echo "=== SCREENSHOT_BASE64_START ==="
            base64 -i /tmp/fail-screen.jpg || true
            echo "=== SCREENSHOT_BASE64_END ==="
          fi
          echo "=== APP RECENT SYSTEM LOGS ==="
          xcrun simctl spawn booted log show --predicate 'process == "Napar"' --last 2m || true
