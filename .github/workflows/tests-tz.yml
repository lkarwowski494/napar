name: Tests across Timezones (TZ Matrix)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-tz:
    name: Jest (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz:
          - UTC
          - Europe/Warsaw
          - America/New_York
          - America/Los_Angeles
          - Asia/Tokyo
          - Pacific/Auckland
          - Pacific/Honolulu

    env:
      TZ: ${{ matrix.tz }}
      NODE_OPTIONS: --max-old-space-size=3072
      FORCE_COLOR: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify system timezone & run full test suite
        run: |
          echo "Uruchamianie w strefie TZ=$TZ ($(date))"
          npx jest --runInBand
